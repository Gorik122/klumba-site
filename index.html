<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Клумба — прополка чужих убеждений</title>
  <meta name="description" content="Твоя жизнь — клумба. Чужие фразы прорастают в ней сорняками, а их корни — программы, которые мешают жить. Садовница вынимает их с корнем." />
  <meta name="theme-color" content="#cbbde0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%23ee8cb4'%3E%3Ccircle cx='16' cy='9' r='6'/%3E%3Ccircle cx='23' cy='16' r='6'/%3E%3Ccircle cx='16' cy='23' r='6'/%3E%3Ccircle cx='9' cy='16' r='6'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='4' fill='%23f3c450'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <div class="track" id="track">
      <div class="stage" id="stage">
        <svg class="layer" id="svgBack" preserveAspectRatio="none" aria-hidden="true"></svg>
        <svg class="layer layer--bed" id="svgFlowers" preserveAspectRatio="none" aria-hidden="true"></svg>
        <svg class="layer" id="svgWeeds" preserveAspectRatio="none" aria-hidden="true"></svg>
        <svg class="layer layer--bed" id="svgFront" preserveAspectRatio="none" aria-hidden="true"></svg>
        <svg class="layer" id="svgGirl" preserveAspectRatio="none" aria-hidden="true"></svg>
        <canvas class="layer" id="fx" aria-hidden="true"></canvas>
        <div class="labels" id="labels" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>

        <header class="top">
          <div class="brand"><i></i>клумба</div>
          <ol class="dots" id="dots" aria-hidden="true"></ol>
        </header>

        <section class="caption" id="caption" aria-live="polite"></section>

        <div class="hint" id="hint"><span>листай вниз</span><i></i></div>
      </div>
    </div>

    <section class="outro" id="outro">
      <div class="outro__inner">
        <p class="kicker">а что растёт у тебя?</p>
        <h2>Каждый сорняк можно вынуть с&nbsp;корнем.</h2>
        <p class="outro__lead">Мы находим фразы, которые когда-то в тебя посадили, и программы, которые из них выросли. И бережно освобождаем место — для твоих цветов.</p>

        <ol class="map" id="map"></ol>

        <!-- Вставь сюда свою ссылку: Telegram, WhatsApp или форму записи -->
        <a class="btn" href="#" id="cta">Записаться на сессию</a>
      </div>
    </section>
  </main>

  <script src="garden.js"></script>
</body>
</html>
